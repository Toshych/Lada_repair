<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lada Repair - Ремонт и обслуживание LADA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="static/styles/style1.css">
    <link rel="stylesheet" href="static/styles/styleformain.css">
    <link rel="stylesheet" href="static/styles/forum.css">
</head>

<body>
    <div class="page">

        <div class="header">
            <div class="header-left">
                <div class="site-title">Lada Repair</div>
                <div class="site-subtitle">Модели и типовые поломки LADA</div>
            </div>
            <div class="photoheader">
                <a href="index.html">
                    <img src="static/styles/image/photoheader.png" alt="Lada Repair Logo">
                </a>
            </div>
        </div>

        <div class="way">Главная</div>

        <div class="left">
            <div class="menu">
                <div class="nav">
                    &#9776;
                    <div class="submenu">
                        <div><a href="models_cars.html">Модели</a></div>
                        <div><a href="#">Тип поломки</a></div>
                        <div><a href="forumm.html">Форум</a></div>
                        <div><a href="#">Распространённые проблемы</a></div>
                        <div><a href="parts.html">Запчасти</a></div>
                    </div>
                </div>
            </div>
        </div>

        <main class="content">
            <!-- Блок авторизации -->
            <div id="authBlock" class="auth-container hidden">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showTab('login')">Вход</button>
                    <button class="tab-btn" onclick="showTab('register')">Регистрация</button>
                </div>

                <form id="loginForm" class="auth-form">
                    <input type="text" id="loginUsername" placeholder="Логин" required>
                    <input type="password" id="loginPassword" placeholder="Пароль" required>
                    <button type="submit" class="f-btn f-btn-primary">Войти</button>
                </form>

                <form id="registerForm" class="auth-form hidden">
                    <input type="text" id="regUsername" placeholder="Придумайте логин" required>
                    <input type="password" id="regPassword" placeholder="Придумайте пароль" required>
                    <button type="submit" class="f-btn f-btn-primary">Зарегистрироваться</button>
                </form>
            </div>

            <!-- Приветствие пользователя -->
            <div id="userGreeting" class="hidden" style="margin-bottom: 15px; font-weight: bold; color: #e31e24;">
                Привет, <span id="currentUserName"></span>!
                <button onclick="logout()"
                    style="background:none; border:none; color:#666; cursor:pointer; text-decoration:underline;">Выйти</button>
            </div>

            <div class="forum-wrapper">
                <div class="forum-top">
                    <h1>Обсуждения</h1>
                    <button class="f-btn f-btn-primary" id="btnToggleCreate">+ Новая тема</button>
                </div>

                <div class="forum-empty" id="emptyState">
                    <p><strong>Обсуждений пока нет.</strong></p>
                    <p>Задайте вопрос о поломке, поделитесь опытом ремонта или обсудите модель LADA.</p>
                </div>

                <ul class="topic-list" id="topicList"></ul>

                <section class="create-form hidden" id="createForm">
                    <h2>Создать тему</h2>
                    <form id="newTopicForm">
                        <input type="text" id="topicTitle"
                            placeholder="Заголовок (например: Плавают обороты на Приоре 1.6)" required>
                        <textarea id="topicContent"
                            placeholder="Опишите проблему подробнее: модель, год, пробег, симптомы..." rows="5"
                            required></textarea>
                        <div class="form-actions">
                            <button type="submit" class="f-btn f-btn-primary">Опубликовать</button>
                            <button type="button" class="f-btn f-btn-secondary" id="btnCancelCreate">Отмена</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>

        <footer class="footer">
            &copy; 2026 Lada Repair. Все права защищены.
        </footer>
    </div>

    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Твой скрипт -->
    <script src="static/js/forum.js"></script>

</body>

</html>
